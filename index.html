<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我要成聖</title>
<style>
  :root { --blue:#8fd3ff; --text:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--text); min-height:100vh;
    background:linear-gradient(135deg,#000,#1c1c1c,#0a0a0a,#333,#111,#000);
    background-size:400% 400%; animation:sky 30s ease infinite;
  }
  @keyframes sky { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  #stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  nav {
    position:fixed; top:0; left:0; right:0; z-index:10; display:flex; justify-content:center; gap:32px;
    padding:14px 10px; background:rgba(0,0,0,.6); backdrop-filter:blur(6px);
  }
  nav a { color:#fff; text-decoration:none; font-weight:700; letter-spacing:2px; }
  nav a:hover { color:var(--blue); }
  section { position:relative; z-index:1; padding:100px 6vw 60px; }
  #home { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  #home h1 { font-size:clamp(48px,10vw,120px); font-weight:900; color:#fff; text-shadow:0 0 24px rgba(255,255,255,.35); }
  #home p { margin-top:18px; font-size:clamp(20px,3.5vw,36px); font-weight:700; color:#fff; }
  #video { display:flex; flex-direction:column; align-items:center; }
  .video-wrap { width:100%; max-width:820px; }
  #video h2 { font-size:clamp(24px,3.5vw,36px); font-weight:900; text-align:left; margin-bottom:12px; }
  .video-box { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .video-box video, .video-box iframe { width:100%; height:100%; border:0; display:block; }
  #board { max-width:820px; margin:0 auto; }
  fieldset { border:2px solid var(--blue); border-radius:0; padding:20px; background:rgba(0,0,0,.4); }
  legend { color:var(--blue); font-weight:900; font-size:20px; padding:0 10px; margin-left:6px; }
  input, textarea {
    width:100%; padding:10px; margin-bottom:10px; background:rgba(255,255,255,.08);
    border:1px solid var(--blue); color:#fff; font:inherit; border-radius:0;
  }
  button { padding:8px 22px; background:var(--blue); color:#06203a; border:0; font-weight:700; cursor:pointer; font:inherit; font-weight:700; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .msg { border-top:1px solid rgba(143,211,255,.4); padding:12px 0; }
  .msg .meta { font-size:13px; color:var(--blue); margin-bottom:4px; }
  .msg .body { white-space:pre-wrap; word-break:break-word; }
  .del { float:right; background:#ff7b7b; padding:2px 10px; font-size:13px; }
  #notice { margin:10px 0; color:#ffd479; font-size:14px; }
  footer { position:relative; z-index:1; text-align:center; padding:30px; font-size:13px; opacity:.7; }
  footer a { color:#fff; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<nav>
  <a href="#home">主頁</a>
  <a href="#video">影片</a>
  <a href="#board">留言版</a>
</nav>

<!-- ① 主頁：想改文字就改這裡 -->
<section id="home">
  <h1>我要成聖</h1>
  <p>你想成聖</p>
</section>

<!-- ② 影片 -->
<section id="video">
  <div class="video-wrap">
  <h2>教學影片</h2>
  <div class="video-box">
    <!-- 方式 A：放在自己網站裡的影片檔（把影片放進 videos 資料夾，命名 tutorial.mp4）-->
    <video controls preload="metadata" playsinline>
      <source src="videos/tutorial.mp4" type="video/mp4">
      你的瀏覽器不支援影片播放。
    </video>

    <!-- 方式 B：YouTube 嵌入（留在網站內播放、不會跳轉）。要用的話，刪掉上面 <video>，改用下面這行，並換掉 VIDEO_ID：
    <iframe src="https://www.youtube.com/embed/VIDEO_ID" allowfullscreen></iframe>
    -->
  </div>
  </div>
</section>

<!-- ③ 留言版 -->
<section id="board">
  <fieldset>
    <legend>留言版</legend>
    <input id="name" maxlength="20" placeholder="你的名字">
    <textarea id="text" rows="3" maxlength="500" placeholder="寫下你的留言…"></textarea>
    <button id="send">送出留言</button>
    <div id="notice"></div>
    <div id="list"></div>
  </fieldset>
</section>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== 動態星空 ===== */
(function () {
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let W, H, stars = [];
  function resize() {
    W = c.width = innerWidth; H = c.height = innerHeight;
    stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .3,
      s: Math.random() * .25 + .05, p: Math.random() * 6.28, f: Math.random() * .03 + .01
    }));
  }
  function draw() {
    x.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.p += s.f; s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      x.globalAlpha = .4 + .6 * Math.abs(Math.sin(s.p));
      x.fillStyle = '#fff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', resize); resize(); draw();
})();

/* ===== Firebase 設定：換成你自己的（見說明）===== */
const firebaseConfig = {
  apiKey: "AIzaSyAJnq1ohEMahG99wIYTH5Pl2H1IGAsTmt4",
  authDomain: "project-5105117209802096570.firebaseapp.com",
  projectId: "project-5105117209802096570"
};

const $ = id => document.getElementById(id);
const notice = t => $('notice').textContent = t || '';
let db;

if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  notice('留言功能尚未設定：請依說明填入 Firebase 設定。');
  $('send').disabled = true;
} else {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.collection('messages').orderBy('createdAt', 'desc').limit(200)
    .onSnapshot(render, e => notice('讀取留言失敗：' + e.message));
}

function render(snap) {
  const list = $('list'); list.innerHTML = '';
  snap.forEach(doc => {
    const d = doc.data(), div = document.createElement('div'); div.className = 'msg';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = d.name + '　' + (d.createdAt ? d.createdAt.toDate().toLocaleString('zh-TW') : '剛剛');
    const body = document.createElement('div'); body.className = 'body'; body.textContent = d.text;
    div.append(meta, body); list.append(div);
  });
}

let last = 0;
$('send').onclick = async () => {
  const name = $('name').value.trim() || '匿名', text = $('text').value.trim();
  if (!text) return notice('請先輸入留言內容。');
  if (Date.now() - last < 10000) return notice('請稍等幾秒再留言。');
  $('send').disabled = true;
  try {
    await db.collection('messages').add({ name, text, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    $('text').value = ''; notice(''); last = Date.now();
  } catch (e) { notice('送出失敗：' + e.message); }
  $('send').disabled = false;
};
</script>
</body>
</html>
